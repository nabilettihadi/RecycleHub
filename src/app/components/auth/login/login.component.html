<div class="min-h-screen bg-gradient-to-br from-green-50 to-green-100 flex flex-col">
  <app-navbar [user]="null"></app-navbar>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
      <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">
          Connexion à votre compte
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Ou
          <a routerLink="/register" class="font-medium text-green-600 hover:text-green-500">
            créer un nouveau compte
          </a>
        </p>
      </div>

      <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md mb-12">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">
                Adresse email
              </label>
              <div class="mt-1">
                <input id="email" 
                       name="email" 
                       type="email" 
                       formControlName="email"
                       [value]="'collector1@recyclehub.ma'"
                       class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
              </div>
              <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="mt-1 text-sm text-red-600">
                <div *ngIf="loginForm.get('email')?.errors?.['required']">L'email est requis</div>
                <div *ngIf="loginForm.get('email')?.errors?.['email']">Veuillez entrer un email valide</div>
              </div>
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-gray-700">
                Mot de passe
              </label>
              <div class="mt-1">
                <input id="password" 
                       name="password" 
                       type="password" 
                       formControlName="password"
                       [value]="'password123'"
                       class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
              </div>
              <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="mt-1 text-sm text-red-600">
                <div *ngIf="loginForm.get('password')?.errors?.['required']">Le mot de passe est requis</div>
                <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</div>
              </div>
            </div>

            <div *ngIf="error$ | async as error" class="text-red-600 mt-2">
              {{ error }}
            </div>

            <div>
              <button type="submit" 
                      [disabled]="!loginForm.valid || (loading$ | async)"
                      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
                <span *ngIf="loading$ | async">Connexion en cours...</span>
                <span *ngIf="!(loading$ | async)">Se connecter</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
