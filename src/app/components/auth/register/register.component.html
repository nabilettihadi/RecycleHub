<div class="min-h-screen bg-gradient-to-br from-green-50 to-green-100 flex flex-col">
  <app-navbar [user]="null"></app-navbar>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900">
          Créez votre compte RecycleHub
        </h2>
        <p class="mt-2 text-lg text-gray-600">
          Rejoignez notre communauté et commencez à recycler dès aujourd'hui
        </p>
      </div>

      <div class="bg-white rounded-lg shadow-xl overflow-hidden">
        <!-- Error Alert -->
        <div *ngIf="error$ | async as error" 
             class="bg-red-50 border-l-4 border-red-500 p-4">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
              </svg>
            </div>
            <div class="ml-3">
              <p class="text-sm text-red-700">{{ error }}</p>
            </div>
          </div>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="p-8 space-y-6">
          <!-- Profile Picture -->
          <div class="flex justify-center">
            <div class="relative">
              <img [src]="imagePreview || 'assets/default-avatar.png'" 
                   alt="Photo de profil" 
                   class="w-32 h-32 rounded-full object-cover ring-4 ring-green-500 ring-offset-4">
              <label class="absolute bottom-0 right-0 bg-green-500 rounded-full p-2 cursor-pointer hover:bg-green-600 transition-colors duration-200">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*">
              </label>
            </div>
          </div>

          <!-- Nom et Prénom -->
          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
              <label class="block text-sm font-medium text-gray-700">Prénom</label>
              <input type="text" formControlName="firstName" 
                     class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Nom</label>
              <input type="text" formControlName="lastName" 
                     class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" formControlName="email" 
                   class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
          </div>

          <!-- Mot de passe -->
          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
              <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
              <input type="password" formControlName="password" 
                     class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Confirmer le mot de passe</label>
              <input type="password" formControlName="confirmPassword" 
                     class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
          </div>

          <!-- Téléphone et Date de naissance -->
          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
              <label class="block text-sm font-medium text-gray-700">Téléphone</label>
              <input type="tel" formControlName="phoneNumber" 
                     class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Date de naissance</label>
              <input type="date" formControlName="dateOfBirth" 
                     class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
          </div>

          <!-- Adresse -->
          <div formGroupName="address" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Rue</label>
              <input type="text" formControlName="street" 
                     class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
              <div>
                <label class="block text-sm font-medium text-gray-700">Ville</label>
                <input type="text" formControlName="city" 
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Code postal</label>
                <input type="text" formControlName="zipCode" 
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div>
            <button type="submit" 
                    [disabled]="!registerForm.valid || (loading$ | async)"
                    class="w-full flex justify-center items-center px-4 py-3 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors duration-200 disabled:opacity-50">
              <svg *ngIf="loading$ | async" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              {{ (loading$ | async) ? 'Création du compte...' : 'Créer mon compte' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
