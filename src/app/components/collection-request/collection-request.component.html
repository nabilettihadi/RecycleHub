<div class="max-w-2xl mx-auto py-10 px-4">
  <h2 class="text-2xl font-bold mb-6 text-center">Nouvelle demande de collecte</h2>
  
  <form [formGroup]="collectionRequestForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Liste des déchets -->
    <div formArrayName="wasteItems" class="space-y-4">
      <div *ngFor="let wasteItem of wasteItems.controls; let i = index" [formGroupName]="i" 
           class="p-4 bg-white shadow rounded-lg">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-medium">Déchet {{i + 1}}</h3>
          <button type="button" 
                  (click)="removeWasteItem(i)"
                  class="text-red-600 hover:text-red-800"
                  [disabled]="wasteItems.length === 1">
            Supprimer
          </button>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-gray-700">Type de déchet</label>
            <select formControlName="type" 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
              <option value="">Sélectionner un type</option>
          <option value="plastique">Plastique</option>
          <option value="verre">Verre</option>
          <option value="papier">Papier</option>
          <option value="metal">Métal</option>
        </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Poids (en grammes)</label>
            <input type="number" 
                   formControlName="weight"
                   min="1000"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
          </div>
        </div>

        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700">Photos (optionnel)</label>
          <input type="file" 
                 (change)="onFileSelected($event, i)" 
                 multiple
                 accept="image/*"
                 class="mt-1 block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-green-50 file:text-green-700
                        hover:file:bg-green-100">
        </div>
    </div>
  </div>

    <button type="button" 
            (click)="addWasteItem()"
            class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
            [disabled]="wasteItems.length >= 3">
      Ajouter un déchet
    </button>

    <!-- Informations de collecte -->
    <div class="space-y-4">
  <div>
        <label class="block text-sm font-medium text-gray-700">Adresse de collecte</label>
        <input type="text" 
               formControlName="collectionAddress"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
  </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-gray-700">Date de collecte</label>
          <input type="date" 
                 formControlName="collectionDate"
                 class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
  </div>

  <div>
          <label class="block text-sm font-medium text-gray-700">Créneau horaire</label>
          <select formControlName="timeSlot"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
            <option value="">Sélectionner un créneau</option>
            <option value="09:00-10:00">09:00 - 10:00</option>
            <option value="10:00-11:00">10:00 - 11:00</option>
            <option value="11:00-12:00">11:00 - 12:00</option>
            <option value="14:00-15:00">14:00 - 15:00</option>
            <option value="15:00-16:00">15:00 - 16:00</option>
            <option value="16:00-17:00">16:00 - 17:00</option>
            <option value="17:00-18:00">17:00 - 18:00</option>
          </select>
        </div>
  </div>

  <div>
        <label class="block text-sm font-medium text-gray-700">Notes supplémentaires (optionnel)</label>
        <textarea formControlName="notes"
                  rows="3"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500"></textarea>
      </div>
  </div>

    <button type="submit" 
            class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
            [disabled]="collectionRequestForm.invalid">
      Soumettre la demande
    </button>
</form>
</div>
