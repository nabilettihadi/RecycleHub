<div class="min-h-screen bg-gray-100 flex flex-col">
  <!-- Navbar -->
  <app-navbar [user]="currentUser$ | async"></app-navbar>

  <!-- Main Content -->
  <main class="flex-grow">
    <div class="max-w-3xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
      <!-- En-tête -->
      <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-900">Nouvelle demande de collecte</h1>
        <p class="mt-2 text-sm text-gray-600">Remplissez les informations pour votre demande de collecte</p>
      </div>

      <!-- Messages d'erreur -->
      <div *ngIf="errorMessage" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4">
        <div class="flex">
          <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
          </div>
          <div class="ml-3">
            <p class="text-sm text-red-700">{{ errorMessage }}</p>
          </div>
        </div>
      </div>

      <form [formGroup]="collectionRequestForm" (ngSubmit)="onSubmit()" class="space-y-8">
        <!-- Liste des déchets -->
        <div formArrayName="wasteItems" class="space-y-6">
          <div *ngFor="let wasteItem of wasteItems.controls; let i = index" [formGroupName]="i" 
               class="bg-white shadow-sm rounded-lg p-6 border border-gray-200">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-medium text-gray-900">Déchet {{ i + 1 }}</h3>
              <button type="button" 
                      (click)="removeWasteItem(i)"
                      [disabled]="wasteItems.length === 1"
                      class="text-red-600 hover:text-red-800 disabled:opacity-50 disabled:cursor-not-allowed">
                <span class="sr-only">Supprimer</span>
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>

            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
              <div>
                <label class="block text-sm font-medium text-gray-700">Type de déchet</label>
                <select formControlName="type" 
                        class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm rounded-md">
                  <option value="">Sélectionner un type</option>
                  <option value="plastique">Plastique (2 points/kg)</option>
                  <option value="verre">Verre (1 point/kg)</option>
                  <option value="papier">Papier (1 point/kg)</option>
                  <option value="metal">Métal (5 points/kg)</option>
                </select>
                <p *ngIf="wasteItem.get('type')?.errors?.['required'] && wasteItem.get('type')?.touched" 
                   class="mt-1 text-sm text-red-600">
                  Le type de déchet est requis
                </p>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">
                  Poids (en grammes)
                  <span class="text-xs text-gray-500 ml-1">(minimum 1000g)</span>
                </label>
                <input type="number" 
                       formControlName="weight"
                       min="1000"
                       class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                <p *ngIf="wasteItem.get('weight')?.errors?.['min'] && wasteItem.get('weight')?.touched" 
                   class="mt-1 text-sm text-red-600">
                  Le poids minimum est de 1000g
                </p>
              </div>
            </div>

            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700">Photos (optionnel)</label>
              <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                <div class="space-y-1 text-center">
                  <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" 
                          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <div class="flex text-sm text-gray-600">
                    <label class="relative cursor-pointer bg-white rounded-md font-medium text-green-600 hover:text-green-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-green-500">
                      <span>Télécharger des photos</span>
                      <input type="file" 
                             class="sr-only"
                             multiple
                             accept="image/*"
                             (change)="onFileSelected($event, i)">
                    </label>
                  </div>
                  <p class="text-xs text-gray-500">PNG, JPG jusqu'à 10MB</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Bouton Ajouter un déchet -->
        <button type="button" 
                (click)="addWasteItem()"
                [disabled]="wasteItems.length >= 3"
                class="w-full flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Ajouter un déchet
        </button>

        <!-- Informations de collecte -->
        <div class="bg-white shadow-sm rounded-lg p-6 border border-gray-200">
          <h3 class="text-lg font-medium text-gray-900 mb-6">Informations de collecte</h3>

          <div formGroupName="collectionAddress" class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700">Rue</label>
              <input type="text" 
                     formControlName="street"
                     class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
            </div>

            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
              <div>
                <label class="block text-sm font-medium text-gray-700">Ville</label>
                <input type="text" 
                       formControlName="city"
                       class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Code postal</label>
                <input type="text" 
                       formControlName="postalCode"
                       class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 mt-6">
            <div>
              <label class="block text-sm font-medium text-gray-700">Date de collecte</label>
              <input type="date" 
                     formControlName="collectionDate"
                     min="{{ today | date:'yyyy-MM-dd' }}"
                     class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Créneau horaire</label>
              <select formControlName="timeSlot"
                      class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm rounded-md">
                <option value="">Sélectionner un créneau</option>
                <option value="09:00-10:00">09:00 - 10:00</option>
                <option value="10:00-11:00">10:00 - 11:00</option>
                <option value="11:00-12:00">11:00 - 12:00</option>
                <option value="14:00-15:00">14:00 - 15:00</option>
                <option value="15:00-16:00">15:00 - 16:00</option>
                <option value="16:00-17:00">16:00 - 17:00</option>
                <option value="17:00-18:00">17:00 - 18:00</option>
              </select>
            </div>
          </div>

          <div class="mt-6">
            <label class="block text-sm font-medium text-gray-700">Notes supplémentaires (optionnel)</label>
            <textarea formControlName="notes"
                      rows="3"
                      class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"></textarea>
          </div>
        </div>

        <!-- Bouton de soumission -->
        <div class="flex justify-end">
          <button type="submit" 
                  [disabled]="!collectionRequestForm.valid || isSubmitting"
                  class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed">
            <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ isSubmitting ? 'Envoi en cours...' : 'Soumettre la demande' }}
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
