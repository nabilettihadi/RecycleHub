<div class="min-h-screen bg-gray-100 py-6 flex flex-col justify-center sm:py-12">
  <div class="relative py-3 sm:max-w-xl sm:mx-auto">
    <div class="relative px-4 py-10 bg-white mx-8 md:mx-0 shadow rounded-3xl sm:p-10">
      <div class="max-w-md mx-auto">
        <div class="divide-y divide-gray-200">
          <div class="py-8 text-base leading-6 space-y-4 text-gray-700 sm:text-lg sm:leading-7">
            <h2 class="text-2xl font-bold mb-8 text-center text-green-600">Mon Profil Collecteur</h2>
            
            <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
              <!-- Informations personnelles -->
              <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                <div>
                  <label class="block text-sm font-medium text-gray-700">Prénom</label>
                  <input type="text" formControlName="firstName"
                         class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                </div>
                
                <div>
                  <label class="block text-sm font-medium text-gray-700">Nom</label>
                  <input type="text" formControlName="lastName"
                         class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" formControlName="email"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Téléphone</label>
                <input type="tel" formControlName="phoneNumber"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
              </div>

              <!-- Adresse -->
              <div formGroupName="address" class="space-y-4">
                <h3 class="text-lg font-medium text-gray-900">Adresse</h3>
                
                <div>
                  <label class="block text-sm font-medium text-gray-700">Rue</label>
                  <input type="text" formControlName="street"
                         class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                </div>

                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                  <div>
                    <label class="block text-sm font-medium text-gray-700">Ville</label>
                    <input type="text" formControlName="city"
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-gray-700">Code Postal</label>
                    <input type="text" formControlName="postalCode"
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                  </div>
                </div>
              </div>

              <div class="pt-5">
                <button type="submit"
                        [disabled]="!profileForm.valid"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
                  Enregistrer les modifications
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
