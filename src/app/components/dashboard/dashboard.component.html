<div class="min-h-screen bg-gray-100">
  <!-- Navigation -->
  <nav class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex">
          <div class="flex-shrink-0 flex items-center">
            <h1 class="text-2xl font-bold text-green-600">RecycleHub</h1>
          </div>
        </div>
        
        <div class="flex items-center">
          <div class="ml-3 relative" *ngIf="currentUser$ | async as user">
            <div class="flex items-center space-x-4">
              <span class="text-gray-700">{{ user.firstName }} {{ user.lastName }}</span>
              <button (click)="onLogout()" 
                class="bg-red-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                Déconnexion
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Points Card -->
        <div class="bg-white overflow-hidden shadow rounded-lg">
          <div class="px-4 py-5 sm:p-6">
            <dt class="text-sm font-medium text-gray-500 truncate">
              Points totaux
            </dt>
            <dd class="mt-1 text-3xl font-semibold text-gray-900">
              {{ (currentUser$ | async)?.points || 0 }}
            </dd>
          </div>
        </div>

        <!-- Collection Requests Card -->
        <div class="bg-white overflow-hidden shadow rounded-lg">
          <div class="px-4 py-5 sm:p-6">
            <dt class="text-sm font-medium text-gray-500 truncate">
              Demandes en cours
            </dt>
            <dd class="mt-1 text-3xl font-semibold text-gray-900">
              0
            </dd>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white overflow-hidden shadow rounded-lg">
          <div class="px-4 py-5 sm:p-6">
            <h3 class="text-lg font-medium text-gray-900">Actions rapides</h3>
            <div class="mt-4 space-y-4">
              <button routerLink="/collection-request" 
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                Nouvelle demande de collecte
              </button>
              <button routerLink="/profile" 
                class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                Modifier mon profil
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
