<div class="max-w-2xl mx-auto py-10">
  <h2 class="text-2xl font-bold mb-6 text-center">Mon Profil</h2>
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="text-center mb-4">
      <img [src]="profileForm.get('profilePicture')?.value || 'assets/default-avatar.png'" 
           class="rounded-full mx-auto mb-3" 
           alt="Profile Picture" 
           style="width: 150px; height: 150px; object-fit: cover;">
      <input type="file" 
             class="hidden" 
             accept="image/*" 
             #fileInput 
             (change)="onFileSelected($event)">
      <button type="button" 
              class="bg-blue-500 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
              (click)="fileInput.click()">
        Changer la photo
      </button>
    </div>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
      <div>
        <label for="firstName" class="block text-sm font-medium text-gray-700">Prénom</label>
        <input type="text" id="firstName" formControlName="firstName" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
      </div>
      <div>
        <label for="lastName" class="block text-sm font-medium text-gray-700">Nom</label>
        <input type="text" id="lastName" formControlName="lastName" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
      </div>
    </div>

    <div>
      <label for="phoneNumber" class="block text-sm font-medium text-gray-700">Téléphone</label>
      <input type="tel" id="phoneNumber" formControlName="phoneNumber" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
    </div>

    <div>
      <label for="dateOfBirth" class="block text-sm font-medium text-gray-700">Date de naissance</label>
      <input type="date" id="dateOfBirth" formControlName="dateOfBirth" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
    </div>

    <div>
      <label for="address" class="block text-sm font-medium text-gray-700">Adresse</label>
      <input type="text" id="address" formControlName="address" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
    </div>

    <div *ngIf="updateSuccess" class="text-green-600">
      Profil mis à jour avec succès!
    </div>

    <div class="flex justify-end">
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
        Enregistrer les modifications
      </button>
    </div>
  </form>

  <div class="mt-10">
    <h5 class="text-red-600 font-bold">Zone dangereuse</h5>
    <p class="text-sm text-gray-600">Une fois que vous supprimez votre compte, il n'y a pas de retour en arrière. Soyez certain.</p>
    <button class="mt-3 bg-red-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
            (click)="onDeleteAccount()">
      Supprimer mon compte
    </button>
  </div>
</div>
