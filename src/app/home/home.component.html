<div class="container">
    <header class="text-center my-4">
        <h1 class="display-4">Bienvenue sur RecycleHub</h1>
        <p class="lead">Votre plateforme de gestion de recyclage</p>
    </header>

    <section class="row">
        <div class="col-md-6 mb-4">
            <div class="card">
                <img src="assets/images/recycling.jpg" class="card-img-top" alt="Recyclage">
                <div class="card-body">
                    <h5 class="card-title">Inscription</h5>
                    <p class="card-text">Créez un compte pour commencer à recycler facilement.</p>
                    <a href="/register" class="btn btn-primary">S'inscrire</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card">
                <img src="assets/images/collection.jpg" class="card-img-top" alt="Collecte">
                <div class="card-body">
                    <h5 class="card-title">Demande de Collecte</h5>
                    <p class="card-text">Soumettez vos demandes de collecte de déchets en quelques clics.</p>
                    <a href="/request-collection" class="btn btn-success">Faire une demande</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="text-center mt-4">
        <p>&copy; 2025 RecycleHub. Tous droits réservés.</p>
    </footer>
</div>
